name: release

on:
  push:
    tags: ["v*"]

# One release at a time, in the order the tags were pushed.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Check package versions
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          for path in (Path("pyproject.toml"), Path("packages/x0r-guard/pyproject.toml")):
              with path.open("rb") as file:
                  actual = tomllib.load(file)["project"]["version"]
              if actual != version:
                  raise SystemExit(f"{path} has version {actual}, but the tag is {tag}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY

      - name: Build distributions
        run: |
          python -m pip install build
          python -m build --outdir dist/x0r-guard packages/x0r-guard
          python -m build --outdir dist/x0r-core .

      - name: Check the built version
        run: |
          python -m venv "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/bin/pip" install dist/x0r-guard/*.whl dist/x0r-core/*.whl
          "$RUNNER_TEMP/check/bin/python" -c "import sys; from x0r_core.main import VERSION; sys.exit(VERSION != '${{ steps.version.outputs.version }}')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: distributions
          path: dist/

      # x0r-guard first: x0r-core depends on it. skip-existing lets a retried run finish.
      - name: Publish x0r-guard
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/x0r-guard/
          skip-existing: true

      - name: Publish x0r-core
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/x0r-core/
          skip-existing: true

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag latest only for the newest release
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          newest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          tags="ghcr.io/x0r-labs/core:${VERSION}"
          if [ "$newest" = "v${VERSION}" ]; then
            tags="${tags},ghcr.io/x0r-labs/core:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
